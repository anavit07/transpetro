<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rota Instrumentação · Transpetro 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F3;--card:#FFFFFF;--ink:#23262B;--muted:#5F6670;--line:#E3E4E1;--acc:#C2560C;--acc2:#F07A1F;--accbg:#FDF0E6;--ok:#1F7A4D;--okbg:#E6F4EC;--bad:#B3261E;--badbg:#FBEAE8;--warn:#8A5A00;--warnbg:#FFF4D6;--esp:#C2560C;--por:#2F5FA8;--mat:#2E7D5B;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header.top{position:sticky;top:0;z-index:5;background:rgba(245,245,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}.brand span{font-size:12px;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
h2{font-size:19px;margin:0 0 6px}h3{font-size:16px;margin:4px 0 8px}h4{font-size:14px;margin:12px 0 2px;color:var(--acc)}
.sec{margin:18px 4px 8px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-size:38px;font-weight:700;color:var(--acc);line-height:1.15;margin:2px 0}
.hero{border-top:4px solid var(--acc2)}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{gap:8px;margin:10px 0}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid2>.card{margin:0}
.grid2+.card,.card+.grid2,.grid2+.grid2{margin-top:12px}
.stat .num{font-size:28px;font-weight:700}
.bar{height:8px;background:#ECEDEA;border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar span{display:block;height:100%;background:var(--acc2);border-radius:8px;transition:width .3s}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 16px;font:600 15px Inter,system-ui,sans-serif;min-height:46px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}.btn.full{width:100%;margin-top:12px}.btn.danger{color:var(--bad);border-color:#EBC3BF}.btn.warnb{background:var(--warnbg);border-color:#EAD39A}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:#F0F1EE;color:var(--ink);border:1px solid var(--line);margin:2px 2px 2px 0;font-family:inherit}
button.chip{cursor:pointer;min-height:34px}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:#BFE0CC}.chip.bad{background:var(--badbg);color:var(--bad);border-color:#F0C6C2}.chip.warn{background:var(--warnbg);color:var(--warn);border-color:#EAD39A}
.chip.esp{background:var(--accbg);color:var(--acc);border-color:#F3CFB3}.chip.por{background:#E8EFF9;color:var(--por);border-color:#C6D5EE}.chip.mat{background:#E5F2EC;color:var(--mat);border-color:#BFDCCD}
.chip.sim{background:#F3E8FB;color:#6B3A8C;border-color:#DCC6EC}.chip.simulado{background:var(--accbg);color:var(--acc)}.chip.prova{background:var(--ink);color:#fff}.chip.descanso{background:var(--okbg);color:var(--ok)}
.plan{font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 0}
select,textarea,input[type=file]{width:100%;margin-top:4px;font:15px Inter,system-ui,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
textarea{min-height:110px}
label.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:10px 0}label.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--acc)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}.seg button{flex:1;min-width:90px;min-height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font:600 14px Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer}.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.qrow,.trow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.qrow:first-of-type,.trow:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;background:#F0F1EE;border-radius:6px;padding:2px 7px;white-space:nowrap}.tag.sim{background:#F3E8FB;color:#6B3A8C}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.clock{font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);font-size:18px;min-width:56px;text-align:right}
.enun{font-size:16px;line-height:1.6;margin:14px 0;white-space:normal}
mark{background:#FFE2C7;color:inherit;border-radius:4px;padding:0 2px}
.alts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.alt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer;min-height:48px;width:100%;margin:4px 0}
.alt.sel{border-color:var(--acc);background:var(--accbg)}.alt.right{border-color:var(--ok);background:var(--okbg)}.alt.wrong{border-color:var(--bad);background:var(--badbg)}.alt:disabled{cursor:default;opacity:1}
.lei{background:#FAFAF8;border:1px dashed #D7D8D4;border-radius:12px;padding:12px;margin-top:8px}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0}.fb.ok{background:var(--okbg);color:#14532D}.fb.bad{background:var(--badbg);color:#7F1D1D}.dica{margin-top:6px;font-size:14px}
.okt{color:var(--ok);font-weight:600}.badt{color:var(--bad);font-weight:600}
.exp p{font-size:15px}
details>summary{cursor:pointer;font-weight:600;padding:4px 0;list-style-position:outside}
details.rev{border-top:1px solid var(--line);padding:8px 0}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}.navgrid button{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.navgrid .done{background:#ECEDEA}.navgrid .mk{border-color:#D9A400;box-shadow:inset 0 -3px 0 #D9A400}.navgrid .cur{background:var(--ink);color:#fff}
.opt{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding:12px 0}.opt .btn{align-self:flex-start;margin-top:6px}
.day.today{border:2px solid var(--acc2)}.day.past{opacity:.8}.day.simulado{background:#FFFBF7}.day.prova{background:var(--ink);color:#fff}.day.prova .muted{color:#ddd}
.revs{margin:6px 0}
.rv{padding:8px 0;border-top:1px solid var(--line)}.rv:first-of-type{border-top:0}
.menu{display:flex;flex-direction:column;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}.menu:first-of-type{border-top:0}
.fcard summary{display:flex;flex-direction:column;gap:6px}.fcard code{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--accbg);color:#7A3608;padding:6px 8px;border-radius:8px;white-space:normal}
dl{margin:10px 0 0}dt{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}dd{margin:2px 0 0;font-size:15px}
.spark{display:flex;gap:8px;align-items:flex-end;height:110px;padding-top:6px}.sb{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}.sb span{width:100%;background:#F3CFB3;border-radius:6px 6px 0 0;min-height:2px}.sb span.full{background:var(--acc)}.sb small{font-size:12px;color:var(--muted);margin-top:4px}
.hide{display:none}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;min-height:58px}
nav.tabs a svg{width:22px;height:22px}nav.tabs a.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#dlg{position:fixed;inset:0;background:rgba(20,22,25,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}#dlg.show{display:flex}
.dbox{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%}
@media (max-width:380px){.big{font-size:32px}.grid2{gap:8px}}
@media (min-width:700px){main{padding-top:20px}}
</style>
</head>

<header class="top"><div class="topin">
  <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-4"/><path d="M12 3v2"/></svg></div>

<script>
/* ================================================================
   BANCO DE QUESTÕES
   - Questões originais: transcritas dos cadernos enviados, com o
     gabarito oficial conferido. Campo "orig": prova + número.
   - "simulada: true" = QUESTÃO SIMULADA — ESTILO CESGRANRIO (inédita,
     criada para cobrir itens do edital 2026 que nunca caíram).
   - Para acrescentar questões: copie um bloco e preencha os campos.
   Campos: id, orig, disc ('esp'|'por'|'mat'), ass (código do assunto),
   sub, tipo ('conceito'|'calculo'|'afirmativas'), dif (1 fácil, 2 média,
   3 difícil), enun, alts [A..E], gab, exp {cobra, reconhecer, resolver,
   armadilha}, dica, chaves (palavras-chave do enunciado)
   ================================================================ */
const BANK = [
// ---------------- METROLOGIA ----------------
{id:"P11-21",orig:"P11 Q21",disc:"esp",ass:"MET",sub:"Rastreabilidade",tipo:"conceito",dif:1,
enun:"Tendo todas as incertezas determinadas, o valor de um padrão que consiste em poder relacionar-se a referências determinadas, geralmente padrões nacionais ou internacionais, por intermédio de uma cadeia ininterrupta das comparações, é denominado",
alts:["acompanhamento","investigação","apuração","rastreabilidade","pesquisa"],gab:"D",
chaves:["cadeia ininterrupta","padrões nacionais ou internacionais"],
exp:{cobra:"A definição de rastreabilidade metrológica (VIM).",reconhecer:"'Cadeia ininterrupta de comparações' + 'padrão nacional/internacional' é sempre rastreabilidade.",resolver:"Rastreabilidade = o resultado pode ser ligado a um padrão de referência por uma cadeia documentada e contínua de calibrações, cada uma com sua incerteza.",armadilha:"As outras palavras são do vocabulário comum, não do VIM. A banca repetiu esta definição em 2018 (P18 Q22)."},
dica:"Viu 'cadeia ininterrupta'? Marque rastreabilidade."},
{id:"P11-23",orig:"P11 Q23",disc:"esp",ass:"MET",sub:"Critério de aceitação",tipo:"conceito",dif:1,
enun:"Considerando que CA é Critério de Aceitação de Equipamento na análise de certificação de calibração de um equipamento, é correto afirmar que",
alts:["|erro| − |incerteza| = CA","|erro| − |incerteza| ≤ CA","|erro| + |incerteza| = CA","|erro| + |incerteza| ≤ CA","|erro| + |incerteza| ≥ CA"],gab:"D",
chaves:["Critério de Aceitação","certificado de calibração"],
exp:{cobra:"A regra para aprovar um instrumento a partir do certificado de calibração.",reconhecer:"Aparece 'CA', 'certificado de calibração' e 'aceitação'.",resolver:"No pior caso, o erro real pode ser o erro encontrado mais a incerteza. Por isso soma-se: |erro| + |incerteza|. O instrumento é aprovado se essa soma não passar do limite: ≤ CA.",armadilha:"Subtrair a incerteza deixaria passar instrumento ruim. O sinal '=' é muito restritivo e o '≥' inverte a lógica."},
dica:"Aceitação = soma tudo e tem que caber no limite: erro + incerteza ≤ CA."},
{id:"P18-21",orig:"P18 Q21",disc:"esp",ass:"MET",sub:"Incerteza e desvio padrão",tipo:"calculo",dif:2,
enun:"Durante o processo de calibração de um instrumento de medição de corrente, obteve-se um limite de erro estatístico igual a 0,003 A, para um intervalo com coeficiente de confiança de 99,7%. Qual o valor aproximado do desvio padrão do valor médio desse processo de calibração?",
alts:["0,0005 A","0,001 A","0,002 A","0,003 A","0,015 A"],gab:"B",
chaves:["99,7%","desvio padrão","limite de erro"],
exp:{cobra:"Relação entre nível de confiança e número de desvios padrão (distribuição normal).",reconhecer:"Os números 68%, 95% e 99,7% indicam 1σ, 2σ e 3σ.",resolver:"99,7% corresponde a ±3σ. Então 3σ = 0,003 A → σ = 0,003 ÷ 3 = 0,001 A.",armadilha:"Usar 2σ dá 0,0015 (não existe) e marcar o próprio limite (0,003) é esquecer de dividir."},
dica:"68 – 95 – 99,7 = 1σ – 2σ – 3σ."},
{id:"P18-23",orig:"P18 Q23",disc:"esp",ass:"MET",sub:"Algarismos significativos",tipo:"calculo",dif:2,
enun:"Um técnico fez a medição de comprimento de três barras distintas, sendo cada medida feita com um instrumento diferente. As medidas obtidas foram 123,7 mm, 257,94 mm e 33,426 mm. Qual o valor aproximado para a soma das medidas dessas três barras, em mm?",
alts:["415","415,1","415,06","415,07","415,066"],gab:"B",
chaves:["instrumento diferente","valor aproximado","soma"],
exp:{cobra:"Arredondamento de uma soma de medidas com resoluções diferentes.",reconhecer:"Medidas com quantidades diferentes de casas decimais sendo somadas.",resolver:"Soma exata: 123,7 + 257,94 + 33,426 = 415,066. Na soma, o resultado fica com as casas decimais da medida menos precisa (123,7 → 1 casa). Resultado: 415,1 mm.",armadilha:"415,066 é a conta 'da calculadora', mas aparenta uma precisão que a medida de 123,7 não tem."},
dica:"Soma e subtração: fica o menor número de casas decimais."},
{id:"T23-22",orig:"T23 Q22",disc:"esp",ass:"MET",sub:"Incerteza combinada",tipo:"calculo",dif:2,
enun:"Na Tabela abaixo, são listados os valores e as incertezas padrão das variáveis a, b e c.\na = 3,75 (incerteza padrão 0,1)\nb = 5,05 (incerteza padrão 0,2)\nc = 2,47 (incerteza padrão 0,2)\nQual a incerteza padrão combinada para o resultado da expressão f = (a − b + c)?",
alts:["0,10","0,15","0,20","0,25","0,30"],gab:"E",
chaves:["incerteza padrão combinada","soma e subtração"],
exp:{cobra:"Propagação de incertezas em soma e subtração.",reconhecer:"Pede 'incerteza combinada' de uma expressão só com + e −.",resolver:"Em soma ou subtração, os sinais não importam: u = √(0,1² + 0,2² + 0,2²) = √(0,01 + 0,04 + 0,04) = √0,09 = 0,30.",armadilha:"Somar direto dá 0,5 (não existe). Subtrair por causa do '−b' é o erro que a banca espera."},
dica:"Incerteza combinada = raiz da soma dos quadrados, sempre com sinal +."},
{id:"T23-24",orig:"T23 Q24",disc:"esp",ass:"MET",sub:"Características do instrumento",tipo:"conceito",dif:1,
enun:"Ao analisar o sinal medido por um instrumento, um técnico observou uma mudança indesejável e lenta do valor medido com o passar do tempo. Em sua análise, esse técnico julgou que fatores intrínsecos estariam causando tal comportamento. O comportamento do sinal medido por esse instrumento é denominado",
alts:["sensibilidade","histérese","zona morta","confiabilidade","drift"],gab:"E",
chaves:["lenta","com o passar do tempo"],
exp:{cobra:"Vocabulário de características de instrumentos.",reconhecer:"'Mudança lenta com o tempo' = deriva (drift).",resolver:"Drift (deriva) é a variação lenta da indicação ao longo do tempo, com a entrada constante.",armadilha:"Histerese depende do sentido (subindo x descendo). Zona morta é faixa sem resposta. Nenhuma das duas é 'com o tempo'."},
dica:"Tempo = drift. Sentido = histerese. Sem resposta = zona morta."},
{id:"P18-40",orig:"P18 Q40",disc:"esp",ass:"MET",sub:"Span",tipo:"conceito",dif:1,
enun:"Uma linguagem técnica no ambiente industrial é fundamental e define algumas características próprias de medida dos diferentes equipamentos da instrumentação industrial. Nesse contexto, a definição de Span é:",
alts:["faixa da variável medida dentro de cujos limites os valores superior e inferior estão compreendidos.","o ponto no qual o controlador é ajustado para um determinado valor.","diferença entre o valor lido ou transmitido pelo instrumento em relação ao valor real da variável medida.","diferença algébrica entre os valores superior e inferior da faixa de medida.","proximidade da medida de uma variável do seu valor verdadeiro."],gab:"D",
chaves:["Span"],
exp:{cobra:"Diferença entre range (faixa) e span (alcance).",reconhecer:"A pergunta é a definição de um termo em inglês.",resolver:"Range é a faixa (ex.: 50 a 150 °C). Span é a diferença superior − inferior (150 − 50 = 100 °C).",armadilha:"(A) é a definição de range. (B) é setpoint, (C) é erro e (E) é exatidão. A banca coloca todas as definições vizinhas."},
dica:"Span é um número só: superior menos inferior."},
{id:"T23-39",orig:"T23 Q39",disc:"esp",ass:"MET",sub:"Campo de tolerância",tipo:"conceito",dif:1,
enun:"Ao longo do processo de medição, um operador recebe a informação de que um dos furos encontrados em uma peça tem dimensão nominal de 38 mm, com afastamentos superior e inferior respectivamente iguais a 64 µm e a 22 µm. O conceito associado à diferença entre a dimensão máxima e a dimensão mínima é o de",
alts:["deriva instrumental","campo de tolerância","erro máximo admissível","erro no ponto de controle","incerteza de medição instrumental"],gab:"B",
chaves:["dimensão máxima","dimensão mínima","afastamentos"],
exp:{cobra:"Definição de tolerância dimensional.",reconhecer:"'Diferença entre a dimensão máxima e a mínima'.",resolver:"Campo de tolerância = dimensão máxima − dimensão mínima = 64 − 22 = 42 µm.",armadilha:"Os números são dados desnecessários: a pergunta é só o nome do conceito."},
dica:"Máximo − mínimo da peça = campo de tolerância."},
// ---------------- UNIDADES / TEMPERATURA ----------------
{id:"T08-31",orig:"T08 Q31",disc:"esp",ass:"UNI",sub:"Pascal",tipo:"conceito",dif:1,
enun:"O Pascal é uma unidade de",
alts:["pressão, equivalente a N/m².","pressão, equivalente a N/cm².","densidade, equivalente a kg/cm³.","densidade, equivalente a kg/m³.","viscosidade, equivalente a N/m.s."],gab:"A",
chaves:["Pascal"],

{id:"P12-36",orig:"P12 Q36",disc:"esp",ass:"TEM",sub:"Escala Fahrenheit",tipo:"conceito",dif:1,

{id:"P18-24",orig:"P18 Q24",disc:"esp",ass:"TEM",sub:"Conversão °F → K",tipo:"calculo",dif:2,
enun:"Um técnico de instrumentação está trabalhando em conjunto com um engenheiro de processo na instalação de um instrumento de medição de temperatura em uma caldeira. O instrumento instalado mostra, em seu visor, a temperatura medida na escala Fahrenheit (F), indicando, no momento do teste, a temperatura de 122 °F. Qual o valor dessa temperatura, na escala absoluta?",
alts:["40","50","273","323,15","581,67"],gab:"D",
chaves:["Fahrenheit","escala absoluta"],
exp:{cobra:"Conversão entre escalas de temperatura.",reconhecer:"'Escala absoluta' = kelvin.",resolver:"°C = (°F − 32) × 5/9 = (122 − 32) × 5/9 = 90 × 5/9 = 50 °C. K = 50 + 273,15 = 323,15 K.",armadilha:"50 é a resposta em Celsius: quem para no meio marca B. 581,67 é Rankine (absoluta em Fahrenheit)."},
dica:"Leia até o fim: 'absoluta' pede kelvin."},
{id:"P12-55",orig:"P12 Q55",disc:"esp",ass:"TEM",sub:"Termopares",tipo:"conceito",dif:2,
enun:"Os termopares são elementos primários de medição em que a",
alts:["junção mantida à temperatura de referência é chamada de junta de referência, enquanto a outra é a junta fria.","força eletromotriz que se desenvolve em um circuito que apresenta junta fria e quente depende somente das temperaturas das juntas e dos metais que compõem os condutores.","associação de dois termopares E1 e E2 em série gera força eletromotriz resultante igual a E1.E2/(E1+E2).","associação de dois termopares E1 e E2 em oposição gera força eletromotriz resultante igual a E1+E2.","utilização de um termopar do tipo B (Pt-Rh30/Pt-Rh6(−)) tem seu uso recomendado para atmosferas altamente oxidantes."],gab:"B",
chaves:["termopares","força eletromotriz"],
exp:{cobra:"Princípio do termopar (efeito Seebeck).",reconhecer:"Alternativas longas sobre juntas e associações de termopares.",resolver:"A fem depende só da diferença de temperatura entre as juntas e do par de metais (lei dos metais homogêneos). Em série, as fem somam; em oposição, subtraem.",armadilha:"(A): junta de referência É a junta fria, não 'a outra'. (C) e (D) trocam as regras de série e oposição."},
dica:"Série soma, oposição subtrai. Junta fria = junta de referência."},
// ---------------- VAZÃO E FLUIDOS ----------------
{id:"T08-29",orig:"T08 Q29",disc:"esp",ass:"VAZ",sub:"Continuidade Q = A·v",tipo:"calculo",dif:2,
enun:"Em um tubo com 200 mm de diâmetro interno escoa um fluido a uma velocidade de 0,8 m/s. Nesta condição, a vazão, em L/s, é de",
alts:["12,56","15,70","18,44","25,12","31,40"],gab:"D",
chaves:["diâmetro interno","velocidade","vazão em L/s"],
exp:{cobra:"Vazão volumétrica a partir de área e velocidade.",reconhecer:"Dá diâmetro e velocidade, pede vazão.",resolver:"D = 200 mm = 0,2 m → r = 0,1 m. A = π·r² = 3,14 × 0,01 = 0,0314 m². Q = A·v = 0,0314 × 0,8 = 0,02512 m³/s. × 1000 = 25,12 L/s.",armadilha:"Usar o diâmetro como raio dá 100,48. Esquecer ×1000 dá 0,025. As alternativas são resultados de erros comuns."},
dica:"Diâmetro ÷ 2, mm → m, e no fim m³/s × 1000 = L/s."},
{id:"P18-59",orig:"P18 Q59",disc:"esp",ass:"VAZ",sub:"Continuidade A₁v₁ = A₂v₂",tipo:"calculo",dif:1,
enun:"Em um sistema de sopro, o ar escoa em regime permanente e com baixa velocidade através de um bocal com áreas de entrada e saída iguais a 0,2 m² e 0,04 m², respectivamente. Assumindo que a velocidade do ar na saída do bocal seja igual a 25 m/s, qual deve ser a velocidade do ar, em m/s, na entrada do bocal?",
alts:["1","5","10","15","20"],gab:"B",
chaves:["regime permanente","áreas de entrada e saída","velocidade"],
exp:{cobra:"Equação da continuidade.",reconhecer:"Duas áreas e uma velocidade; pede a outra velocidade.",resolver:"A₁·v₁ = A₂·v₂ → 0,2·v₁ = 0,04 × 25 = 1 → v₁ = 5 m/s.",armadilha:"Área maior = velocidade menor. Quem multiplica em vez de dividir encontra 125."},
dica:"Cano largo, fluido lento. Cano estreito, fluido rápido."},
{id:"P12-58",orig:"P12 Q58",disc:"esp",ass:"VAZ",sub:"Pressão dinâmica",tipo:"calculo",dif:1,
enun:"Um fluido tem massa específica igual a ρ e flui a 10 m/s em um duto de diâmetro igual a 5 cm. Qual o valor da pressão dinâmica gerada pela circulação desse fluido? Dado: aceleração da gravidade = 10 m/s²",
alts:["5 ρ","10 ρ","20 ρ","50 ρ","100 ρ"],gab:"D",
chaves:["pressão dinâmica","massa específica","velocidade"],
exp:{cobra:"Termo dinâmico da equação de Bernoulli.",reconhecer:"'Pressão dinâmica' sempre leva a ½ρv².",resolver:"p = ½ × ρ × v² = ½ × ρ × 10² = 50ρ.",armadilha:"O diâmetro e a gravidade são dados desnecessários, colocados para você usá-los errado."},
dica:"Pressão dinâmica = metade de ρ vezes v ao quadrado. Ignore o resto."},
{id:"T08-32",orig:"T08 Q32",disc:"esp",ass:"VAZ",sub:"Placa de orifício",tipo:"conceito",dif:1,
enun:"A placa de orifício é utilizada para a medição de",
alts:["pressão.","nível.","temperatura.","vazão.","densidade."],gab:"D",

dica:"Placa, Venturi, bocal, Pitot: medem vazão por ΔP."},
{id:"P11-56",orig:"P11 Q56",disc:"esp",ass:"VAZ",sub:"Placa excêntrica",tipo:"conceito",dif:2,
enun:"Na medição da vazão de um fluido particulado, realizada por meio de uma placa de orifício, é recomendado que o orifício seja do tipo",

chaves:["particulado","placa de orifício"],

{id:"P12-37",orig:"P12 Q37",disc:"esp",ass:"VAZ",sub:"Medidor sem perda de carga",tipo:"conceito",dif:1,
enun:"Entre os medidores de vazão, aquele que NÃO gera perda de pressão na linha é o(a)",
alts:["ultrassônico (efeito doppler)","tubo de pitot","efeito coriolis","turbina","placa de orifício"],gab:"A",

{id:"P11-27",orig:"P11 Q27",disc:"esp",ass:"TRA",sub:"Ruído eletromagnético",tipo:"conceito",dif:1,

{id:"P12-33",orig:"P12 Q33",disc:"esp",ass:"TRA",sub:"Alimentação a 4 fios",tipo:"conceito",dif:1,

{id:"P11-32",orig:"P11 Q32",disc:"esp",ass:"VAL",sub:"Elemento final de controle",tipo:"conceito",dif:1,

dica:"Elemento final recebe a ordem e mexe no processo."},
{id:"P11-33",orig:"P11 Q33",disc:"esp",ass:"VAL",sub:"Válvula rotativa",tipo:"conceito",dif:1,
enun:"A válvula hidráulica, um dos principais componentes de um sistema de controle, pode ser de deslocamento linear ou rotativo. Um exemplo de deslocamento rotativo ocorre na válvula",

{id:"P11-34",orig:"P11 Q34",disc:"esp",ass:"VAL",sub:"Posicionador",tipo:"conceito",dif:1,

// ---------------- ISA ----------------
{id:"T08-26",orig:"T08 Q26",disc:"esp",ass:"ISA",sub:"Letras de identificação",tipo:"conceito",dif:1,

chaves:["LSH"],
exp:{cobra:"Leitura das letras ISA 5.1.",reconhecer:"Sigla de 2 a 4 letras.",resolver:"1ª letra = variável: L (nível). Depois a função: S (chave). Último modificador: H (alto). LSH = chave de nível alto.",armadilha:"H (high) x L (low). O L do começo é nível; o L do fim seria 'baixo'."},

{id:"P18-36",orig:"P18 Q36",disc:"esp",ass:"ISA",sub:"Letras de identificação",tipo:"conceito",dif:1,
enun:"Uma grande indústria do ramo petrolífero pretende realizar a manutenção em uma das suas malhas de controle. Uma equipe de instrumentistas terá que trocar alguns instrumentos e transmissores que apresentaram defeito, como os PIC, LIC, FT e TT que, nessa ordem, são responsáveis pelo controle e a transmissão das variáveis",
alts:["pressão, nível, vazão e nível","pressão, nível, vazão e temperatura","pressão, nível, densidade e temperatura","nível, vazão, densidade e temperatura","nível, densidade, vazão e pressão"],gab:"B",
chaves:["PIC","LIC","FT","TT"],
exp:{cobra:"Primeira letra ISA = variável.",reconhecer:"Lista de siglas.",resolver:"P = pressão, L = nível (level), F = vazão (flow), T = temperatura. D seria densidade.",armadilha:"F não é 'fluido' nem densidade: é vazão."},
dica:"P pressão · L nível · F vazão · T temperatura · A análise · D densidade."},
{id:"P18-39",orig:"P18 Q39",disc:"esp",ass:"ISA",sub:"Segunda letra",tipo:"conceito",dif:1,
enun:"Para um projeto de engenharia, a simbologia e a identificação dos instrumentos são fundamentais para estruturar o projeto. A ISA (The Instrumentation, Systems & Automation Society) conceitua que cada instrumento será identificado por conjunto de Letras e Números. A segunda letra do conjunto de letras",
alts:["representa a função do instrumento na malha","representa a variável de medida","representa a possibilidade de instalação em ambiente restrito","indica a malha do processo no qual o instrumento está inserido","indica a área/fábrica à qual pertence o instrumento"],gab:"A",
chaves:["segunda letra"],
exp:{cobra:"Estrutura do tag ISA.",reconhecer:"'Primeira letra' ou 'segunda letra'.",resolver:"Letras: 1ª = variável medida; seguintes = função (I indica, C controla, T transmite...). Números = malha.",armadilha:"(B) é a primeira letra. (D) é o número da malha."},
dica:"Letra 1 = variável. Letra 2 em diante = função. Número = malha."},

{id:"P11-46",orig:"P11 Q46",disc:"esp",ass:"CTL",sub:"Erro em regime",tipo:"conceito",dif:1,

{id:"P12-49",orig:"P12 Q49",disc:"esp",ass:"CTL",sub:"Sobressinal e sintonia",tipo:"conceito",dif:2,
enun:"Um sistema de controle realimentado por um controlador PID apresenta um percentual de ultrapassagem (sobrepasso) de 40% para uma entrada do tipo degrau. Qual mudança deve ser feita na sintonia desse controlador para reduzir o percentual de ultrapassagem?",

// ---------------- SIS ----------------
{id:"T08-37",orig:"T08 Q37",disc:"esp",ass:"SIS",sub:"Intertravamentos",tipo:"conceito",dif:2,

{id:"P18-47",orig:"P18 Q47",disc:"esp",ass:"SIS",sub:"Intertravamento permissivo",tipo:"conceito",dif:2,

alts:["Há um aumento da pressão, ultrapassando o limite máximo seguro.","Há uma diminuição da temperatura, ultrapassando o limite mínimo seguro.","A pressão está dentro dos valores de limites máximo e mínimo seguros.","O acionamento de uma resistência elétrica em um tanque se dá somente após a detecção do nível.","Há o transbordamento de um fluido em um reservatório devido ao acionamento de uma bomba em uma malha de controle, ultrapassando o limite máximo seguro de nível."],gab:"D",

exp:{cobra:"Diferença entre intertravamento ativo e permissivo.",reconhecer:"'Só liga depois que...' = permissivo.",resolver:"Permissivo: uma condição precisa ser satisfeita para PERMITIR a ação (resistência só liga se houver nível). Ativo: age para desligar quando um limite é ultrapassado.",armadilha:"(A), (B) e (E) descrevem situações em que o intertravamento ativo agiria."},

{id:"P12-42",orig:"P12 Q42",disc:"esp",ass:"SIS",sub:"SIL 2",tipo:"calculo",dif:2,
enun:"Qual o grau aceitável de sucesso esperado para um sistema de controle com SIL nível 2 e disponibilidade desejada de 99,00%?",
alts:["1","10","100","1000","10000"],gab:"C",
chaves:["SIL","disponibilidade"],
exp:{cobra:"Relação entre SIL, PFD e fator de redução de risco.",reconhecer:"SIL + disponibilidade em %.",resolver:"Disponibilidade 99% → PFD = 1 − 0,99 = 0,01 = 10⁻². Fator de redução de risco = 1/PFD = 100.",armadilha:"Confundir SIL 2 com 'fator 10'. SIL 1: 10–100; SIL 2: 100–1000; SIL 3: 1000–10000."},

{id:"T23-31",orig:"T23 Q31",disc:"esp",ass:"SIS",sub:"F&G e ESD",tipo:"conceito",dif:1,
enun:"Alguns sistemas são extremamente importantes para o funcionamento seguro de uma indústria. Em uma plataforma, por exemplo, os sistemas de Fogo e Gás (Fire & Gas) e de Desligamento de Emergência (ESD – Emergency Shutdown) são cruciais para a segurança. Os sistemas de Fire & Gas e de ESD são classificados como sistemas",
alts:["instrumentados de segurança","automáticos de segurança","de segurança aumentada","ciberfísicos","críticos"],gab:"A",

// ---------------- MANUTENÇÃO ----------------
{id:"T08-39",orig:"T08 Q39",disc:"esp",ass:"MAN",sub:"Preditiva",tipo:"conceito",dif:1,
enun:"Um cupom de corrosão instalado em uma tubulação de produção tem aplicação no tipo de manutenção",
alts:["corretiva.","sistemática.","extensiva.","preditiva.","proativa."],gab:"D",
chaves:["cupom de corrosão"],
exp:{cobra:"Tipos de manutenção.",reconhecer:"Algo que acompanha a condição do equipamento.",resolver:"O cupom mede a taxa de corrosão ao longo do tempo: é monitoramento de condição, logo preditiva.",armadilha:"'Sistemática' é preventiva por calendário."},
dica:"Mede/monitora a condição = preditiva."},
{id:"P11-40",orig:"P11 Q40",disc:"esp",ass:"MAN",sub:"Preventiva",tipo:"conceito",dif:1,
enun:"Caracteriza o emprego da manutenção preventiva, a",
alts:["troca do pneu do carro após ter furado.","troca de óleo após verificar-se na vareta que ele estava abaixo do especificado.","verificação se está na hora de substituição do pneu devido ao desgaste, medindo a distância do perfil rodante e a marca de troca.","substituição de uma bateria automotiva quando ela atingiu o período de troca especificado pelo fabricante.","substituição de uma lâmpada depois de ter queimado."],gab:"D",
chaves:["preventiva"],
exp:{cobra:"Diferença entre corretiva, preventiva e preditiva.",reconhecer:"Exemplos do dia a dia para classificar.",resolver:"Preventiva = pelo prazo do fabricante, mesmo sem defeito (bateria). Preditiva = medindo a condição (vareta, desgaste do pneu). Corretiva = depois da falha (pneu furado, lâmpada queimada).",armadilha:"(B) e (C) parecem preventivas, mas dependem de medir: são preditivas."},
dica:"Prazo = preventiva. Medição = preditiva. Quebrou = corretiva."},
{id:"P12-27",orig:"P12 Q27",disc:"esp",ass:"MAN",sub:"Tipos de manutenção",tipo:"afirmativas",dif:2,
enun:"Considere as afirmações que versam sobre os diversos tipos de manutenção.\nI - A troca de lubrificante realizada conforme recomendação do fabricante do equipamento é uma ação de manutenção preventiva.\nII - A substituição de um componente por consequência da parada inesperada de um equipamento é uma ação de manutenção corretiva.\nIII - O desmonte para análise, em data previamente determinada pelo fabricante do equipamento, mesmo sem identificação de falha, é uma ação de manutenção corretiva.\nIV - A monitoração do nível de vibração em um mancal de um equipamento rotativo é uma ação de manutenção preditiva.\nEstá correto o que se afirma em",
alts:["I e III, apenas.","I, II e III, apenas.","I, II e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],gab:"C",
chaves:["data previamente determinada","sem identificação de falha"],
exp:{cobra:"Classificar exemplos de manutenção.",reconhecer:"Afirmativas I a IV com exemplos.",resolver:"I preventiva (prazo) ✓. II corretiva (após falha) ✓. III: data marcada e sem falha é PREVENTIVA, não corretiva ✗. IV preditiva (vibração) ✓. Resposta: I, II e IV.",armadilha:"O item III troca a palavra final. Leia sempre a última palavra da afirmativa."},
dica:"Em afirmativas, a pegadinha costuma estar na última palavra."},
{id:"P11-38",orig:"P11 Q38",disc:"esp",ass:"MAN",sub:"Comissionamento",tipo:"conceito",dif:1,
enun:"Em sistemas de manutenção, o termo comissionamento é definido",
alts:["como o emprego sistemático das três abordagens de manutenção.","como o modelo pelo qual as equipes de manutenção são designadas para suas atividades diárias, tendo como direcionador a experiência do líder da equipe.","como garantia de operação em grandes empreendimentos industriais que necessitam de intenso envolvimento do pessoal de produção com as técnicas de manutenção.","pelo uso de sistemas de manutenção que buscam minimizar os custos e o tempo de parada da operação, empregando tanto a abordagem preventiva quanto a preditiva.","pelo conjunto de técnicas e procedimentos de engenharia aplicados de forma integrada a uma unidade (ou planta) industrial, com vistas a torná-la operacional, dentro dos requisitos estabelecidos pelo cliente final."],gab:"E",
chaves:["comissionamento"],
exp:{cobra:"Definição de comissionamento.",reconhecer:"Palavra 'comissionamento'.",resolver:"Comissionamento = verificar e preparar a planta (ou equipamento) para operar conforme os requisitos do cliente.",armadilha:"As outras falam de manutenção em geral. Em 2023 caiu de novo (T23 Q57)."},
dica:"Comissionar = deixar pronto para operar, conforme especificado."},
// ---------------- ANALÍTICA / SEGURANÇA ----------------
{id:"T08-35",orig:"T08 Q35",disc:"esp",ass:"ANA",sub:"Cromatografia",tipo:"conceito",dif:1,
enun:"Os gases utilizados como gás de arraste nos cromatógrafos são:",
alts:["hidrogênio, oxigênio, nitrogênio e argônio.","oxigênio, nitrogênio, argônio e hélio.","nitrogênio, argônio, hélio e hidrogênio.","argônio, hélio, hidrogênio e oxigênio.","hélio, hidrogênio, oxigênio e nitrogênio."],gab:"C",
chaves:["gás de arraste"],

dica:"Gás de arraste nunca é oxigênio."},
{id:"P11-60",orig:"P11 Q60",disc:"esp",ass:"ANA",sub:"Cromatografia",tipo:"conceito",dif:1,
enun:"A cromatografia de gás é uma técnica utilizada para medir a",
alts:["vazão de um gás ou líquido volátil","energia de um gás ou líquido volátil","densidade de um gás ou líquido volátil","velocidade de um gás ou líquido volátil","composição de um gás ou líquido volátil"],gab:"E",
chaves:["cromatografia"],
exp:{cobra:"O que cada analisador mede.",reconhecer:"Cromatógrafo.",resolver:"A coluna separa os componentes; o detector mede cada um: composição.",armadilha:"Densidade tem densímetro; vazão tem medidor de vazão."},
dica:"Cromatógrafo = composição."},
{id:"T23-32",orig:"T23 Q32",disc:"esp",ass:"SEG",sub:"Mapa de risco",tipo:"conceito",dif:1,
enun:"Um técnico participou de uma comissão instituída pela CIPA de sua empresa para a elaboração de um mapa de riscos do setor em que ele trabalha. Ele identificou que no seu setor existem riscos físicos, químicos e ergonômicos. As cores que deverão ser incluídas no mapa de risco do setor em que o técnico trabalha são, respectivamente,",
alts:["preto, marrom e laranja","laranja, verde e vermelho","laranja, marrom e azul","verde, vermelho e amarelo","verde, vermelho e azul"],gab:"D",
chaves:["mapa de riscos","respectivamente"],
exp:{cobra:"Cores do mapa de riscos.",reconhecer:"Mapa de risco + tipos de risco.",resolver:"Físico verde, químico vermelho, biológico marrom, ergonômico amarelo, acidente azul.",armadilha:"'Respectivamente' exige a ordem certa. Azul é acidente, não ergonômico."},
dica:"Verde Físico · Vermelho Químico · Marrom Biológico · Amarelo Ergonômico · Azul Acidente."},
{id:"T23-38",orig:"T23 Q38",disc:"esp",ass:"SEG",sub:"NR-35",tipo:"conceito",dif:1,
enun:"Um técnico de instrumentação identificou que um sensor de vazão estava danificado. O sensor estava instalado em uma tubulação que estava a uma dada altura do chão. O técnico não pôde fazer a intervenção, pois seu treinamento de NR 35 — Trabalho em altura — estava vencido. A altura mínima, em metros, do nível inferior para que um trabalho que tenha risco de queda seja considerado um trabalho em altura, conforme essa norma, é de",
alts:["5","3","2","4","1"],gab:"C",
chaves:["NR 35","altura mínima"],
exp:{cobra:"Definição da NR-35.",reconhecer:"Trabalho em altura.",resolver:"Trabalho em altura = acima de 2 m do nível inferior, com risco de queda.",armadilha:"A ordem das alternativas está embaralhada de propósito."},
dica:"NR-35: acima de 2 metros."},
// ---------------- ELETRÔNICA ----------------
{id:"P18-52",orig:"P18 Q52",disc:"esp",ass:"ELA",sub:"Amp-op inversor",tipo:"calculo",dif:2,
enun:"Na eletrônica moderna, o uso de amplificadores de ganho é muito comum e está presente em vários componentes industriais, como em alguns transmissores que precisam condicionar o sinal antes de enviá-lo ao controlador. Em um Amplificador Inversor, as resistências R1 (entrada) e Rf (realimentação) valem, respectivamente, 10 Ω e 50 Ω e a entrada Vi = 100 mVcc. O valor esperado na saída, Vo, do amplificador, em mV, é",
alts:["500","100","−500","−100","−50"],gab:"C",
chaves:["Inversor","Rf","R1"],
exp:{cobra:"Ganho do amplificador inversor.",reconhecer:"'Inversor' + dois resistores.",resolver:"Vo = −(Rf/R1)·Vi = −(50/10) × 100 = −500 mV.",armadilha:"Esquecer o sinal negativo leva a 500 (A). 'Inversor' = saída com sinal trocado. (Enunciado adaptado: a figura foi descrita em texto.)"},
dica:"Inversor = menos (Rf ÷ R1)."},
{id:"P18-54",orig:"P18 Q54",disc:"esp",ass:"ELA",sub:"Transistor",tipo:"calculo",dif:1,
enun:"Um técnico precisa substituir um transistor em uma placa eletrônica. O ganho de corrente desse transistor (β) possui um valor de 200. Assim, sabendo-se que a corrente no coletor vale 10 mA, o valor da corrente de base, em mA, é",
alts:["20","10","5","0,5","0,05"],gab:"E",
chaves:["ganho de corrente","coletor","base"],
exp:{cobra:"Relação IC = β·IB.",reconhecer:"β + uma corrente.",resolver:"IB = IC ÷ β = 10 ÷ 200 = 0,05 mA.",armadilha:"Multiplicar dá 2000 (não existe). A base sempre tem corrente MENOR que o coletor."},
dica:"Base é pequena: divida pelo β."},
{id:"P12-24",orig:"P12 Q24",disc:"esp",ass:"DIG",sub:"Resolução do conversor AD",tipo:"calculo",dif:3,
enun:"Um conversor analógico-digital de 12 bits, com faixa de entrada de 0 V a 10 V, foi utilizado em conjunto com um termômetro cuja saída varia linearmente entre 0 V e 1 V para uma faixa de temperatura compreendida entre 0 °C e 100 °C. A resolução desse sistema, em °C, será de, aproximadamente,",
alts:["2,4","0,12","0,24","0,024","0,0024"],gab:"C",
chaves:["12 bits","faixa de entrada","resolução"],
exp:{cobra:"Resolução de conversor AD com sensor que não usa a faixa toda.",reconhecer:"Número de bits + faixa em volts.",resolver:"Passo do AD = 10 V ÷ 2¹² = 10 ÷ 4096 ≈ 2,44 mV. Sensor: 1 V = 100 °C → 1 mV = 0,1 °C. Resolução = 2,44 × 0,1 ≈ 0,24 °C.",armadilha:"Se você usar 100 °C ÷ 4096 = 0,024, esquece que o sensor ocupa só 1 V dos 10 V do conversor."},
dica:"Resolução = faixa do AD ÷ 2ⁿ, depois converta volts para a variável."},

alts:["válvula solenoide","chave fim de curso","filtro regulador","booster pneumático","volante manual"],gab:"C",

{id:"SIM-03",orig:"QUESTÃO SIMULADA — ESTILO CESGRANRIO",simulada:true,disc:"esp",ass:"CTL",sub:"Sintonia Ziegler-Nichols",tipo:"conceito",dif:2,

dica:"ZN malha fechada: suba o P até oscilar sem parar."},
{id:"SIM-04",orig:"QUESTÃO SIMULADA — ESTILO CESGRANRIO",simulada:true,disc:"esp",ass:"VAL",sub:"Coeficiente Cv",tipo:"conceito",dif:2,

{id:"SIM-05",orig:"QUESTÃO SIMULADA — ESTILO CESGRANRIO",simulada:true,disc:"esp",ass:"PRE",sub:"Nível por pressão",tipo:"calculo",dif:2,
enun:"Um transmissor de pressão instalado no fundo de um tanque aberto mede o nível de um líquido de densidade relativa 0,8. Para uma coluna de líquido de 2 m, a pressão medida, em kPa, é (considere g = 10 m/s² e massa específica da água = 1.000 kg/m³)",
alts:["8","16","20","25","160"],gab:"B",
chaves:["densidade relativa","coluna de líquido"],
exp:{cobra:"Medição de nível por pressão hidrostática (item 6 do edital).",reconhecer:"Nível + pressão + densidade.",resolver:"ρ = 0,8 × 1000 = 800 kg/m³. P = ρ·g·h = 800 × 10 × 2 = 16 000 Pa = 16 kPa.",armadilha:"Usar a densidade da água dá 20. Esquecer de dividir por 1000 dá 16 000."},

{id:"SIM-06",orig:"QUESTÃO SIMULADA — ESTILO CESGRANRIO",simulada:true,disc:"esp",ass:"ANA",sub:"Analisador de O₂",tipo:"conceito",dif:2,

alts:["da tensão gerada pela diferença de concentração de oxigênio entre os dois lados da célula aquecida","da absorção de radiação infravermelha pelo oxigênio","da variação do pH do gás","do tempo de retenção em uma coluna","da condutividade elétrica da água de condensado"],gab:"A",
chaves:["zircônia","oxigênio"],
exp:{cobra:"Analisadores (item 17 do edital).",reconhecer:"Zircônia + O₂.",resolver:"A zircônia aquecida conduz íons de oxigênio. A diferença de concentração entre o gás e o ar de referência gera uma tensão (mV) proporcional ao log da razão.",armadilha:"Tempo de retenção é cromatografia; condutividade é condutivímetro. A banca mistura analisadores."},

// ======================= PORTUGUÊS =======================
{id:"T08-08",orig:"T08 Q8",disc:"por",ass:"CRA",sub:"Há, a e à",tipo:"conceito",dif:2,
enun:"___ vários anos, existem hábitos pouco recomendáveis como copiar obras alheias. ___ partir de livros reconhecidos, faz-se, ___ margem dos bons costumes, ___ prática da cópia.\nA opção que preenche as lacunas do texto acima com as palavras corretamente escritas, de acordo com a norma culta, é",
alts:["À, A, a, à","A, À, à, a","A, A, há, à","Há, A, à, a","Há, À, a, a"],gab:"D",
chaves:["lacunas","vários anos","partir"],
exp:{cobra:"Há (tempo passado) e crase.",reconhecer:"Lacunas com a / à / há.",resolver:"1) 'Há vários anos' = tempo decorrido (pode trocar por 'faz'). 2) 'A partir': antes de verbo nunca há crase. 3) 'À margem': locução feminina = crase. 4) 'a prática': artigo só, sujeito de 'faz-se'.",armadilha:"'À partir' é o erro mais comum: verbo nunca leva crase."},
dica:"Dá para trocar por 'faz'? Use HÁ. Antes de verbo? Nunca crase."},
{id:"T08-09",orig:"T08 Q9",disc:"por",ass:"CVE",sub:"Concordância verbal",tipo:"conceito",dif:2,
enun:"Em qual das frases a seguir a concordância verbal segue a norma culta?",
alts:["Mais de um jornal comentaram o lançamento do novo dicionário.","Ontem foi lançado, com um grande evento, mais dois volumes da Enciclopédia.","Tanto o Aurélio quanto o Houaiss passam por atualizações periódicas.","O Aurélio ou o Houaiss receberam o prêmio de melhor dicionário do ano.","Trinta por cento dos dicionários apresenta algum verbete falso."],gab:"C",
chaves:["concordância verbal"],
exp:{cobra:"Concordância com sujeitos especiais.",reconhecer:"Frases com 'mais de um', porcentagem, 'ou', 'tanto... quanto'.",resolver:"'Tanto A quanto B' = sujeito composto → plural (passam). 'Mais de um jornal' → singular. 'Foram lançados mais dois volumes'. 'Ou' de exclusão → singular (recebeu). 'Trinta por cento dos dicionários' → concorda com 'dicionários' (apresentam).",armadilha:"O verbo antes do sujeito (B) engana: inverta a frase para testar."},
dica:"Coloque o sujeito antes do verbo e leia de novo."},
{id:"T08-10",orig:"T08 Q10",disc:"por",ass:"CON",sub:"Concessão",tipo:"conceito",dif:1,
enun:"Analise a sentença: “Quem repete o verbete falso é porque copiou, por mais que o disfarce.”\nA ideia concessiva de por mais que só NÃO se mantém se essa expressão for substituída por",
alts:["embora.","conquanto.","contanto que.","mesmo que.","ainda que."],gab:"C",
chaves:["concessiva","NÃO"],
exp:{cobra:"Valor dos conectivos.",reconhecer:"Pede o conectivo que muda o sentido.",resolver:"Concessão = 'apesar de': embora, conquanto, mesmo que, ainda que, por mais que. 'Contanto que' é CONDIÇÃO (= desde que).",armadilha:"'Contanto' parece 'conquanto'. São opostos no sentido."},
dica:"Concessão = 'apesar de'. Condição = 'desde que'."},
{id:"P11-07",orig:"P11 Q7 (enunciado adaptado)",disc:"por",ass:"CVE",sub:"Haver e fazer",tipo:"conceito",dif:1,
enun:"Por fugir à norma-padrão, a frase que seria provável alvo de críticas está presente em:",
alts:["Somos todos falantes do mesmo idioma.","Fazem dois meses que surgiu a polêmica.","Sempre há mais dúvidas que certezas sobre a língua.","Sou eu que não quero mais discutir sobre esse assunto.","A maior parte das pessoas aceitam a variação linguística."],gab:"B",
chaves:["norma-padrão"],
exp:{cobra:"Verbos impessoais.",reconhecer:"'Fazer' ou 'haver' indicando tempo.",resolver:"'Fazer' indicando tempo decorrido é impessoal: fica no singular. Correto: 'Faz dois meses'.",armadilha:"(E) 'A maior parte das pessoas aceitam' é aceito pela norma (concordância com o especificador). O erro claro é (B)."},
dica:"Faz e há de tempo: sempre singular."},
{id:"P12-04",orig:"P12 Q4",disc:"por",ass:"CVE",sub:"Concordância verbal",tipo:"conceito",dif:1,
enun:"A concordância está de acordo com a norma-padrão em:",
alts:["Vai acontecer muitas inovações no século XXI.","Existe cientistas que investigam produtos para 2050.","A maioria dos brasileiros acredita que o mundo vai melhorar.","O passeio aos planetas e às estações espaciais vão ser normais no futuro.","Daqui a alguns anos, provavelmente haverão lojas com robôs vendedores."],gab:"C",
chaves:["concordância"],
exp:{cobra:"Sujeito posposto e verbo haver.",reconhecer:"Verbo antes do sujeito; 'haver'.",resolver:"(A) Vão acontecer muitas inovações. (B) Existem cientistas. (D) O passeio... vai ser normal (núcleo 'passeio'). (E) haverá lojas (haver = existir é impessoal). (C) está correta.",armadilha:"'Haverão' soa natural, mas 'haver' no sentido de existir não vai para o plural."},
dica:"Haver = existir → singular. Existir → concorda normalmente."},
{id:"P18-03",orig:"P18 Q3",disc:"por",ass:"CRA",sub:"Crase obrigatória",tipo:"conceito",dif:2,
enun:"A frase em que o uso do sinal indicativo da crase é obrigatório na palavra destacada (a) é:",
alts:["A elevação da temperatura da Terra tem concorrido para gerar prejuízos inigualáveis a todas as nações.","Os fabricantes de agrotóxicos recusam-se a reconhecer a responsabilidade que possuem nos danos ao meio ambiente.","O aquecimento do planeta tem estado aliado a índices muito altos de gases do efeito estufa liberados pelos países industrializados.","Os grandes temporais causam imensos danos a população em razão da sua potência destruidora.","Os países desenvolvidos atingiram a meta de redução da poluição estabelecida pelos cientistas em reuniões mundiais."],gab:"D",
chaves:["crase","obrigatório"],
exp:{cobra:"Quando a crase é obrigatória.",reconhecer:"'a' antes de palavras diferentes.",resolver:"Crase = preposição 'a' + artigo 'a'. 'Causar danos a (prep.) + a população (artigo)' → à população. Teste: troque por masculino: 'danos ao povo' → tem 'ao', então tem crase.",armadilha:"(A) antes de 'todas' (pronome) não tem crase. (B) antes de verbo, nunca. (C) antes de palavra masculina ('índices'), nunca."},
dica:"Troque por masculino: deu 'ao'? Então é 'à'."},
{id:"P18-09",orig:"P18 Q9",disc:"por",ass:"CRA",sub:"Há x a",tipo:"conceito",dif:2,
enun:"A palavra destacada (a / há) está corretamente empregada de acordo com a norma-padrão da língua portuguesa em:",
alts:["As atletas olímpicas se esforçaram para conquistar os títulos cobiçados a poucos dias do encerramento do campeonato.","Daqui há menos de dois anos, o Japão será o anfitrião dos Jogos Olímpicos e os preparativos estão adiantados.","Os jogadores brasileiros de futebol estão há poucos meses de se dirigirem à Rússia para participar da Copa do Mundo.","Os japoneses comemoravam, a alguns anos, a escolha de Tóquio como sede dos Jogos Olímpicos de 2020, derrotando Istambul e Madri.","Um dos estádios onde serão realizados os Jogos Olímpicos está situado há apenas poucos quilômetros do centro da capital."],gab:"A",
chaves:["há","a"],
exp:{cobra:"Há (passado) x a (futuro e distância).",reconhecer:"'há' e 'a' antes de tempo ou distância.",resolver:"HÁ = tempo passado (troca por 'faz'). A = tempo futuro ou distância. (A) 'a poucos dias do encerramento' = faltando dias → futuro → 'a' ✓. (B) daqui a. (C) estão a poucos meses. (D) há alguns anos. (E) a poucos quilômetros.",armadilha:"'Daqui há' é o erro mais comum. 'Daqui' já indica futuro: daqui A."},
dica:"Já passou = HÁ. Vai acontecer ou distância = A."},
{id:"P18-07",orig:"P18 Q7",disc:"por",ass:"CVE",sub:"Núcleo do sujeito",tipo:"conceito",dif:2,
enun:"A forma verbal destacada está empregada de acordo com as exigências da norma-padrão da língua portuguesa em:",
alts:["A discussão sobre os direitos humanos têm evidenciado a necessidade de garantir o acesso de todas as pessoas a uma vida sem discriminação.","A proposta dos cientistas que participam dos congressos internacionais sobre as cidades sustentáveis têm sido rejeitadas pelos economistas.","O acordo internacional sobre mudanças climáticas aprovado pelos países desenvolvidos podem subsidiar novos hábitos e compromissos das nações em relação ao desenvolvimento.","O enfrentamento dos principais problemas ambientais, sociais e econômicos decorrentes do manejo inadequado dos resíduos sólidos devem ser iniciados imediatamente.","Os avanços obtidos pelo mundo na construção de uma agenda global para enfrentar a explosão urbana planetária em 2050 devem ser valorizados."],gab:"E",
chaves:["forma verbal"],
exp:{cobra:"Concordância com o núcleo do sujeito.",reconhecer:"Sujeito longo, núcleo longe do verbo.",resolver:"Ache o núcleo: (A) discussão → tem. (B) proposta → tem sido rejeitada. (C) acordo → pode. (D) enfrentamento → deve ser iniciado. (E) avanços → devem ✓.",armadilha:"A banca coloca um plural perto do verbo ('direitos humanos', 'cientistas') para enganar."},
dica:"Pergunte 'o que/quem?' ao verbo e ache UMA palavra: o núcleo."},
{id:"T23-06",orig:"T23 Q6",disc:"por",ass:"CON",sub:"Conclusão",tipo:"conceito",dif:1,
enun:"No trecho “Esses venenos seriam, portanto, um mal necessário, de acordo com esses produtores.”, a palavra destacada (portanto) veicula a relação lógica de",
alts:["adição","conclusão","concessão","explicação","temporalidade"],gab:"B",
chaves:["relação lógica","portanto"],
exp:{cobra:"Valor dos conectivos.",reconhecer:"Uma palavra destacada + 'relação lógica'.",resolver:"Portanto, logo, por isso, então = conclusão.",armadilha:"'Explicação' (pois, porque) é a vizinha mais confundida."},
dica:"Portanto = logo = conclusão."},
{id:"T23-09",orig:"T23 Q9",disc:"por",ass:"PON",sub:"Vírgula",tipo:"conceito",dif:2,
enun:"O emprego da vírgula está plenamente de acordo com as exigências da norma-padrão da língua portuguesa em:",
alts:["A enorme quantidade de agrotóxicos empregados, para exterminar pragas nas plantações contamina as águas e os solos de toda a região.","A função dos agrotóxicos de acordo com os produtores, é reduzir a quantidade de pragas e facilitar a vida do agricultor para que ele tenha seus lucros garantidos.","A presença de pragas nos alimentos, pode sofrer uma grande redução se for possível dar preferência a alimentos cozidos ao invés de in natura.","Estudos realizados em várias partes do mundo têm provado que os alimentos orgânicos, sem uso de fertilizantes químicos, respeitam a saúde dos trabalhadores e dos consumidores.","O depoimento de especialistas que estudam meios de melhorar a produção agrícola, revela que o extermínio de pragas na lavoura tem sido realizado de forma inadequada."],gab:"D",
chaves:["vírgula"],
exp:{cobra:"Vírgula entre sujeito e verbo e intercalação.",reconhecer:"Frases longas com uma vírgula 'solta'.",resolver:"(A), (C) e (E) separam o sujeito do verbo com uma vírgula só. (B) abre a intercalação 'de acordo com os produtores' sem a primeira vírgula. (D) isola a intercalação entre duas vírgulas ✓.",armadilha:"Sujeito longo dá vontade de 'respirar' antes do verbo. Na escrita, é proibido."},
dica:"Intercalação: duas vírgulas ou nenhuma. Sujeito e verbo: nenhuma."},
{id:"T23-10",orig:"T23 Q10",disc:"por",ass:"CNO",sub:"Concordância nominal",tipo:"conceito",dif:3,
enun:"De acordo com as regras de concordância nominal da norma-padrão da língua portuguesa, a palavra destacada (o particípio após 'devem ser', 'são' ou 'têm sido') está empregada corretamente em:",
alts:["A mudança das leis sobre o uso de agrotóxicos e a repressão dos órgãos de vigilância sanitária devem ser implementadas com urgência para evitar mais mortes.","As leis instituídas para proteger os cidadãos e os ensinamentos dos estudiosos sobre o uso de agrotóxicos devem ser divulgadas para que tenham alcance geral.","O desenvolvimento de novas estratégias de plantio e a substituição da agricultura convencional pela orgânica são consideradas uma exigência dos tempos atuais para muitos produtores rurais.","Os estudos realizados por especialistas de saúde em laboratórios e a busca por exterminar doenças contagiosas são indicativas do progresso da medicina nos últimos tempos.","Os procedimentos orientados pelos especialistas e a concessão de verbas públicas pelos órgãos governamentais têm sido entendidas como imprescindíveis para o desenvolvimento da agricultura familiar."],gab:"A",
chaves:["concordância nominal"],
exp:{cobra:"Adjetivo/particípio com dois núcleos de gêneros diferentes.",reconhecer:"Sujeito composto e um particípio depois do verbo.",resolver:"Ache os dois núcleos. (A) mudança + repressão (fem.) → implementadas ✓. (B) leis + ensinamentos (masc. no grupo) → divulgados. (C) desenvolvimento + substituição → considerados. (D) estudos + busca → indicativos. (E) procedimentos + concessão → entendidos.",armadilha:"Se há um masculino entre os núcleos, o plural fica no masculino."},
dica:"Um masculino no grupo = plural masculino."},
// ======================= MATEMÁTICA =======================
{id:"T08-12",orig:"T08 Q12",disc:"mat",ass:"PRO",sub:"Divisão em partes iguais",tipo:"calculo",dif:1,
enun:"Uma empresa de propaganda instalou dois outdoors em uma estrada, o primeiro no km 78 e o segundo no km 246. A mesma empresa pretende instalar outros 7 outdoors entre esses dois, de modo que a distância entre dois outdoors consecutivos seja sempre a mesma. Qual será, em km, essa distância?",
alts:["21","24","26","28","31"],gab:"A",
chaves:["entre esses dois","consecutivos"],
exp:{cobra:"Contar intervalos, não objetos.",reconhecer:"Itens igualmente espaçados entre dois pontos.",resolver:"Distância total: 246 − 78 = 168 km. Com 7 outdoors no meio, são 9 outdoors e 8 intervalos. 168 ÷ 8 = 21 km.",armadilha:"Dividir por 7 dá 24 (B), que está nas alternativas."},
dica:"n objetos em linha = n − 1 intervalos."},
{id:"T08-16",orig:"T08 Q16",disc:"mat",ass:"ESP",sub:"Volume do cilindro",tipo:"calculo",dif:2,
enun:"“Uma pastilha cilíndrica de urânio, de 1 cm de altura e 1 cm de diâmetro, produz a mesma energia que 565 litros de petróleo.” Considere que a quantidade de energia produzida por uma pastilha cilíndrica de urânio seja proporcional ao seu volume. Quantos litros de petróleo são necessários para produzir a mesma quantidade de energia que uma pastilha cilíndrica de urânio com 2 cm de altura e 2 cm de diâmetro produz?",
alts:["1.130","2.260","2.820","3.390","4.520"],gab:"E",
chaves:["proporcional ao seu volume","cilíndrica"],
exp:{cobra:"Como o volume muda quando as medidas mudam.",reconhecer:"Cilindro com medidas dobradas.",resolver:"V = π·r²·h. Dobrando o raio, r² fica ×4. Dobrando a altura, ×2. Volume ×8. 565 × 8 = 4.520 L.",armadilha:"Achar que dobra (1.130) ou quadruplica (2.260)."},
dica:"Raio entra ao quadrado no volume do cilindro."},
{id:"T08-18",orig:"T08 Q18",disc:"mat",ass:"EQ",sub:"Sistema soma e diferença",tipo:"calculo",dif:1,
enun:"Um eletricista autônomo fez dois serviços no mesmo dia e recebeu, ao todo, R$ 56,00. Se um dos serviços custou R$ 4,00 a mais do que o outro, quanto ele recebeu, em reais, pelo serviço mais caro?",
alts:["23,00","26,00","27,00","30,00","31,00"],gab:"D",
chaves:["ao todo","a mais"],
exp:{cobra:"Montar um sistema a partir do texto.",reconhecer:"Soma total + diferença entre dois valores.",resolver:"x + y = 56 e x − y = 4. Somando: 2x = 60 → x = 30.",armadilha:"26 é o serviço mais barato: leia qual dos dois a pergunta quer."},
dica:"Soma e diferença: o maior = (soma + diferença) ÷ 2."},
{id:"T08-19",orig:"T08 Q19",disc:"mat",ass:"CMB",sub:"Combinação",tipo:"calculo",dif:2,
enun:"Para ganhar o prêmio máximo na “Sena”, o apostador precisa acertar as seis “dezenas” sorteadas de um total de 60 “dezenas” possíveis. Certo apostador fez sua aposta marcando dez “dezenas” distintas em um mesmo cartão. Quantas chances de ganhar o prêmio máximo tem esse apostador?",
alts:["60","110","150","180","210"],gab:"E",
chaves:["seis dezenas","dez dezenas","chances"],
exp:{cobra:"Combinação simples.",reconhecer:"Escolher grupos em que a ordem não importa.",resolver:"Cada grupo de 6 entre as 10 marcadas é uma chance: C(10,6) = C(10,4) = (10·9·8·7)/(4·3·2·1) = 5040/24 = 210.",armadilha:"O 60 do texto é dado desnecessário. Usar arranjo dá um número muito maior."},
dica:"A ordem não importa? Combinação: divida pelo fatorial."},
{id:"P12-20",orig:"P12 Q20",disc:"mat",ass:"PCT",sub:"Desconto",tipo:"calculo",dif:1,
enun:"Fábio contratou um empréstimo bancário que deveria ser quitado em 30 de março de 2012. Como conseguiu o dinheiro necessário 30 dias antes dessa data, Fábio negociou com o gerente e conseguiu 5% de desconto. Assim, quitou o empréstimo antecipadamente, pagando R$ 4.940,00. Qual era, em reais, o valor a ser pago por Fábio em 30 de março de 2012?",
alts:["5.187,00","5.200,00","5.871,00","6.300,00","7.410,00"],gab:"B",
chaves:["5% de desconto","pagando"],
exp:{cobra:"Voltar ao valor original depois de um desconto.",reconhecer:"Dá o valor COM desconto e pede o original.",resolver:"Com 5% de desconto, pagou 95%: 0,95·x = 4.940 → x = 4.940 ÷ 0,95 = 5.200.",armadilha:"Somar 5% de 4.940 dá 5.187 (A): o desconto foi sobre o valor original, não sobre 4.940."},
dica:"Depois do desconto de d%, divida por (1 − d)."},
{id:"P18-20",orig:"P18 Q20",disc:"mat",ass:"PCT",sub:"Porcentagem do total",tipo:"calculo",dif:1,
enun:"Os estagiários de uma empresa combinaram fazer uma salada de frutas para seu lanche. A salada de frutas foi feita apenas com frutas de que todos gostam, o que levou à decisão de usarem apenas maçã, laranja e banana. No dia combinado, 20% dos estagiários levaram maçãs, 35% dos estagiários levaram laranjas e os 9 estagiários restantes levaram bananas. Se todos levaram apenas um tipo de fruta, quantos estagiários há na empresa?",
alts:["18","20","35","40","45"],gab:"B",
chaves:["restantes","%"],
exp:{cobra:"Achar o total a partir da parte que sobra.",reconhecer:"Porcentagens de partes + um número absoluto do resto.",resolver:"Bananas = 100% − 20% − 35% = 45%. 0,45·T = 9 → T = 20.",armadilha:"45 é a porcentagem, não o total. Está nas alternativas."},
dica:"Ache quantos % o número dado representa e divida."},
{id:"T23-16",orig:"T23 Q16",disc:"mat",ass:"EQ",sub:"Velocidade e tempo",tipo:"calculo",dif:2,
enun:"Um carro partiu de um ponto A até um ponto B andando com uma velocidade constante de 80 km/h. Posteriormente o carro refez o mesmo percurso, mas agora com velocidade constante igual a 100 km/h, e gastou 30 minutos a menos do que na primeira vez. Quanto tempo o carro levou para ir do ponto A ao ponto B, na primeira vez?",
alts:["3h","2h30min","2h","1h50min","1h30min"],gab:"B",
chaves:["mesmo percurso","30 minutos a menos"],
exp:{cobra:"Equação com distância = velocidade × tempo.",reconhecer:"Mesmo percurso, duas velocidades, diferença de tempo.",resolver:"d/80 − d/100 = 0,5 h. MMC 400: 5d − 4d = 200 → d = 200 km. Tempo 1: 200 ÷ 80 = 2,5 h = 2h30min.",armadilha:"30 min = 0,5 h, não 0,3. A segunda viagem (2h) também aparece nas alternativas."},
dica:"Minutos → horas: divida por 60."},
{id:"T23-17",orig:"T23 Q17",disc:"mat",ass:"PRO",sub:"Regra de três composta",tipo:"calculo",dif:2,
enun:"Em uma fábrica, há um tanque cuja capacidade máxima é de 180 m³. Estando o tanque vazio, três torneiras de mesma vazão gastam oito horas para enchê-lo completamente. Um outro tanque, com capacidade máxima de x metros cúbicos, está sendo construído e, quando vazio, cinco torneiras (com a mesma vazão das anteriores) deverão enchê-lo completamente em apenas y horas. Nessas condições, o valor de y em função de x é definido por",
alts:["y = 2x/81","y = 2x/54","y = 2x/45","y = 2x/27","y = 2x/75"],gab:"E",
chaves:["mesma vazão","torneiras","horas"],
exp:{cobra:"Proporção com vazão.",reconhecer:"Torneiras, tempo e volume.",resolver:"Vazão de 1 torneira: 180 ÷ (3 × 8) = 7,5 m³/h. 5 torneiras: 37,5 m³/h. y = x ÷ 37,5 = 2x/75.",armadilha:"Mais torneiras = menos tempo (grandeza inversa). Calcule a vazão de uma torneira primeiro."},
dica:"Ache quanto UMA torneira faz por hora."},
{id:"T23-19",orig:"T23 Q19",disc:"mat",ass:"GEO",sub:"Pitágoras e área",tipo:"calculo",dif:1,
enun:"O triângulo ABC é retângulo em A. Sabe-se que o comprimento da hipotenusa BC é igual a 20 cm, e que o comprimento do cateto AB é igual a 12 cm. Qual é a área, em cm², do triângulo ABC?",
alts:["16","48","60","96","240"],gab:"D",
chaves:["retângulo","hipotenusa","cateto"],
exp:{cobra:"Teorema de Pitágoras + área.",reconhecer:"Triângulo retângulo com dois lados dados.",resolver:"AC² = 20² − 12² = 400 − 144 = 256 → AC = 16. Área = (12 × 16) ÷ 2 = 96.",armadilha:"Usar a hipotenusa como base: (20 × 12) ÷ 2 = 120 (não existe) ou esquecer o ÷2 (192)."},
dica:"Área do triângulo retângulo = cateto × cateto ÷ 2."},
{id:"T23-20",orig:"T23 Q20",disc:"mat",ass:"EQ",sub:"Sistema linear",tipo:"calculo",dif:1,
enun:"Um consumidor foi ao mercado, comprou 1 kg de batata e 1 kg de cebola e pagou R$ 11,00. No dia seguinte, ele comprou 3 kg de batata e 2 kg de cebola e pagou R$ 28,00. No terceiro dia, ele comprou 2 kg de batata e 1 kg de cebola. Considerando-se que os preços não foram alterados durante esse período, que valor, em R$, o consumidor pagou no terceiro dia?",
alts:["5","6","16","17","39"],gab:"D",
chaves:["preços não foram alterados"],
exp:{cobra:"Sistema 2x2.",reconhecer:"Duas compras com o total pago.",resolver:"b + c = 11; 3b + 2c = 28. Da 1ª: c = 11 − b → 3b + 22 − 2b = 28 → b = 6, c = 5. Terceiro dia: 2·6 + 5 = 17.",armadilha:"6 e 5 são os preços unitários, e estão nas alternativas."},
dica:"Resolva o sistema e responda o que a pergunta pede, não o x."},

/* ---------- datas (sempre no fuso do aparelho) ---------- */
function hoje() { const d = new Date(); return ymd(d); }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDias(s, n) { const [y, m, d] = s.split("-").map(Number); const x = new Date(y, m - 1, d + n); return ymd(x); }
function difDias(a, b) { const [y1, m1, d1] = a.split("-").map(Number), [y2, m2, d2] = b.split("-").map(Number); return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 864e5); }
function fmtData(s) { const [y, m, d] = s.split("-"); const dw = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][new Date(+y, m - 1, +d).getDay()]; return `${dw} ${d}/${m}`; }

/* ---------- estado ---------- */
function novoEstado() { return { v: 1, upd: 0, ans: {}, errs: [], topics: {}, cal: {}, days: {}, sims: [], settings: { leitura: true, unlock: false } }; }
let S = novoEstado();
let mem = null; // fallback em memória se o localStorage falhar
function carregarLocal() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(novoEstado(), JSON.parse(raw)); }
  catch (e) { if (mem) S = mem; }
}
let dbRef = null, saveTimer = null, syncMsg = "Salvo neste aparelho";
function salvar() {
  S.upd = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { mem = S; }
  if (dbRef) { clearTimeout(saveTimer); saveTimer = setTimeout(salvarNuvem, 1500); }
}
async function salvarNuvem() {
  try { await dbRef.set({ json: JSON.stringify(S), upd: S.upd }); syncMsg = "Salvo na sua conta e neste aparelho"; }
  catch (e) { syncMsg = "Salvo só neste aparelho (a conta não respondeu)"; }
  const el = $("#sync"); if (el) el.textContent = syncMsg;
}
async function conectarConta() {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection("data/users/" + id).doc("estado");
    const t = setTimeout(() => {}, 10000);
    let snap = await ref.get(); clearTimeout(t);
    let d = snap && (typeof snap.data === "function" ? snap.data() : (snap.data !== undefined ? snap.data : snap));
    if (d && d.json && (d.upd || 0) > (S.upd || 0)) { S = Object.assign(novoEstado(), JSON.parse(d.json)); try { localStorage.setItem(KEY, d.json); } catch (e) {} render(); }
    dbRef = ref; syncMsg = "Salvo na sua conta e neste aparelho";
    if (!d || (S.upd || 0) > (d.upd || 0)) salvarNuvem();
    const el = $("#sync"); if (el) el.textContent = syncMsg;
  } catch (e) { /* segue só com o aparelho */ }
}

/* ---------- banco: disponibilidade ---------- */
function bloqueada(q) {
  if (S.settings.unlock || q.simulada) return false;
  const p = q.orig.slice(0, 3); return LOCKS[p] && hoje() < LOCKS[p];
}
function disponiveis() { return BANK.filter(q => !bloqueada(q)); }
const byId = Object.fromEntries(BANK.map(q => [q.id, q]));

/* ---------- registro de respostas ---------- */
function registrar(q, letra, viaSim) {
  const ok = letra === q.gab, d = hoje();
  const a = S.ans[q.id] || (S.ans[q.id] = { n: 0, c: 0, dias: [], ult: null });
  a.n++; if (ok) { a.c++; if (!a.dias.includes(d)) a.dias.push(d); }
  a.ult = { d, ok, ch: letra };
  S.days[d] = (S.days[d] || 0) + 1;
  if (!S.topics[q.ass]) S.topics[q.ass] = { first: d, rev: {} };
  if (!ok) S.errs.push({ id: q.id, ch: letra, d });
  if (S.errs.length > 600) S.errs = S.errs.slice(-600);
  salvar(); return ok;
}
function erradasIds() { return Object.entries(S.ans).filter(([id, a]) => a.ult && !a.ult.ok && byId[id]).map(([id]) => id); }
function statsDisc(disc) {
  let n = 0, c = 0; for (const [id, a] of Object.entries(S.ans)) { const q = byId[id]; if (q && (!disc || q.disc === disc)) { n += a.n; c += a.c; } }
  return { n, c, p: n ? Math.round(100 * c / n) : null };
}
function statsAss() {
  const m = {}; for (const [id, a] of Object.entries(S.ans)) { const q = byId[id]; if (!q) continue; const s = m[q.ass] || (m[q.ass] = { n: 0, c: 0, dias: new Set(), disc: q.disc }); s.n += a.n; s.c += a.c; a.dias.forEach(x => s.dias.add(x)); }
  return m;
}
function dominados() { return Object.entries(statsAss()).filter(([a, s]) => s.n >= 4 && s.c / s.n >= .8 && s.dias.size >= 2).map(([a]) => a); }
function revisoesDevidas() {
  const t = hoje(), out = [];
  for (const [a, info] of Object.entries(S.topics)) for (const k of [1, 3, 7]) {
    const due = addDias(info.first, k); if (due <= t && !(info.rev || {})[k]) out.push({ a, k, due });
  }
  return out;
}
function precisaRevisar() {
  const s = statsAss(); const fracos = Object.entries(s).filter(([a, v]) => v.n >= 2 && v.c / v.n < .6).map(([a]) => a);
  return [...new Set([...fracos, ...revisoesDevidas().map(r => r.a)])];
}
function sequencia() {
  let n = 0, d = hoje(); if (!S.days[d]) d = addDias(d, -1);
  while (S.days[d]) { n++; d = addDias(d, -1); } return n;
}
function marcarRevisao(a, k) { if (!S.topics[a]) return; S.topics[a].rev = S.topics[a].rev || {}; S.topics[a].rev[k] = hoje(); salvar(); }

let quiz = null; // sessão em andamento
function rota() { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : "inicio"; }
function ir(v) { if (location.hash.slice(1) === v) render(); else location.hash = v; }
window.addEventListener("hashchange", render);

function filtrar() {

}
function embaralhar(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function praticarDia(d) { const c = diaCal(d); praticarAssuntos([...c.ass, ...c.pass, ...c.mass]); }

/* ---------- Sessão de treino (feedback a cada questão) ---------- */
function iniciarTreino(lista, extra = {}) {

}
function iniciarCafe() {

  const revs = revisoesDevidas().map(r => r.a);

      + `<div class="alts">${q.alts.map((t, k) => { const L = "ABCDE"[k]; let cls = ""; if (fb) { if (L === q.gab) cls = "right"; else if (L === r) cls = "wrong"; } else if (L === quiz.sel || (sim && L === r)) cls = "sel";
        return `<button class="alt ${cls}" ${fb ? "disabled" : ""} onclick="selecionar('${L}')"><b>(${L})</b> ${esc(t)}</button>`; }).join("")}</div>`;
    if (!fb && !sim) corpo += `<button class="btn primary full" ${quiz.sel ? "" : "disabled"} onclick="confirmar()">Confirmar resposta</button>`;
    if (sim) corpo += `<div class="row between gap"><button class="btn" ${quiz.i ? "" : "disabled"} onclick="navSim(-1)">Anterior</button><button class="btn ${quiz.marc[q.id] ? "warnb" : ""}" onclick="quiz.marc['${q.id}']=!quiz.marc['${q.id}'];desenharQ()">${quiz.marc[q.id] ? "Marcada" : "Marcar p/ revisar"}</button><button class="btn primary" onclick="navSim(1)">${quiz.i + 1 < n ? "Próxima" : "Revisar e finalizar"}</button></div>
      <div class="navgrid">${quiz.lista.map((id, k) => `<button class="${k === quiz.i ? "cur" : ""} ${quiz.resp[id] ? "done" : ""} ${quiz.marc[id] ? "mk" : ""}" onclick="quiz.i=${k};desenharQ()">${k + 1}</button>`).join("")}</div>

    if (fb) corpo += explicacao(q, r === q.gab) + `<button class="btn primary full" onclick="proxima()">${quiz.i + 1 < n && !quiz.encerrado ? "Próxima questão" : "Ver resultado"}</button>`;
  }

}
function explicacao(q, ok) {

}
function responderLeitura(a) { const q = byId[quiz.lista[quiz.i]]; quiz.leitura[q.id] = { a, ok: a === q.ass }; if (a === q.ass) quiz.leituraOk = (quiz.leituraOk || 0) + 1; quiz.fase = "resposta"; quiz.sel = null; desenharQ(); }
function selecionar(L) { const q = byId[quiz.lista[quiz.i]]; if (quiz.modo === "simulado") { quiz.resp[q.id] = L; desenharQ(); } else { quiz.sel = L; desenharQ(); } }
function confirmar() { const q = byId[quiz.lista[quiz.i]]; quiz.resp[q.id] = quiz.sel; if (registrar(q, quiz.sel)) quiz.acertos++; quiz.fase = "feedback"; desenharQ(); }
function proxima() {
  if (quiz.i + 1 >= quiz.lista.length || quiz.encerrado) { resumoSessao(); return; }
  quiz.i++; quiz.sel = null; quiz.fase = (quiz.modo === "cafe" || S.settings.leitura) ? "leitura" : "resposta"; desenharQ();
}
function navSim(d) { const n = quiz.lista.length; if (quiz.i + d >= n) { pedirFinalizar(); return; } quiz.i = Math.max(0, quiz.i + d); desenharQ(); }
function pedirFinalizar() {
  const sem = quiz.lista.filter(id => !quiz.resp[id]).length, mk = quiz.lista.filter(id => quiz.marc[id]).length;
  dialogo(`Finalizar o simulado?`, `${sem ? sem + " sem resposta. " : ""}${mk ? mk + " marcadas para revisar. " : ""}Na prova, erro não desconta: não deixe nenhuma em branco.`, "Finalizar", finalizarSimulado);
}
function finalizarSimulado() {
  clearInterval(tick); const res = { esp: [0, 0], por: [0, 0], mat: [0, 0] }, fracos = {};
  for (const id of quiz.lista) { const q = byId[id], L = quiz.resp[id]; res[q.disc][1]++; if (L) { const ok = registrar(q, L, true); if (ok) res[q.disc][0]++; else fracos[q.ass] = (fracos[q.ass] || 0) + 1; } else fracos[q.ass] = (fracos[q.ass] || 0) + 1; }
  const c = res.esp[0] + res.por[0] + res.mat[0], n = quiz.lista.length;
  const pct = k => res[k][1] ? Math.round(100 * res[k][0] / res[k][1]) + "%" : null;
  S.sims.push({ d: hoje(), tipo: { rapido: "Rápido", completo: "Completo", erradas: "Só erradas" }[quiz.tipo], c, n, por: { esp: pct("esp"), por: pct("por"), mat: pct("mat") } }); salvar();
  quiz.fase = "resultado"; quiz.res = { res, fracos, c, n };
  const box = $("#qz");
  box.innerHTML = `<section class="card"><h2>Resultado do simulado</h2><div class="big">${c} / ${n}</div>
    ${["esp", "por", "mat"].filter(k => res[k][1]).map(k => `<div class="row between small"><span>${DISC[k]}</span><span>${res[k][0]} de ${res[k][1]} · ${pct(k)}</span></div>${barra(100 * res[k][0] / res[k][1], "var(--" + k + ")")}`).join("")}
    <h3>Assuntos que mais precisam de atenção</h3>${Object.entries(fracos).sort((a, b) => b[1] - a[1]).map(([a, k]) => `<button class="chip warn" onclick="praticarAssuntos(['${a}'])">${esc(nome(a))} · ${k}</button>`).join(" ") || `<p class="muted small">Nenhum erro.</p>`}
    <h3>Gabarito comentado</h3>${quiz.lista.map((id, k) => { const q = byId[id], L = quiz.resp[id], ok = L === q.gab; return `<details class="rev"><summary><span class="${ok ? "okt" : "badt"}">${k + 1}. ${ok ? "Certa" : L ? "Errada" : "Em branco"}</span> · ${esc(q.orig)} · ${esc(nome(q.ass))}</summary><div class="enun">${esc(q.enun).replace(/\n/g, "<br>")}</div><p class="small">Sua resposta: <b>${L || "—"}</b> · Correta: <b>${q.gab}</b> — ${esc(q.alts["ABCDE".indexOf(q.gab)])}</p>${explicacaoPura(q)}</details>`; }).join("")}
    <button class="btn primary full" onclick="quiz=null;ir('simulado')">Voltar aos simulados</button></section>`;
}
function explicacaoPura(q) { return `<div class="exp"><h4>O que cobra</h4><p>${esc(q.exp.cobra)}</p><h4>Como reconhecer</h4><p>${esc(q.exp.reconhecer)}</p><h4>Como resolver</h4><p>${esc(q.exp.resolver)}</p><h4>Armadilha</h4><p>${esc(q.exp.armadilha)}</p></div>`; }
function resumoSessao() {

function exportarTexto() { const t = $("#exp"); t.value = JSON.stringify(S); t.classList.remove("hide"); $("#cpy").classList.remove("hide"); t.select(); }
async function copiar() { try { await navigator.clipboard.writeText($("#exp").value); aviso("Copiado."); } catch (e) { $("#exp").select(); aviso("Selecione o texto e copie manualmente."); } }

function importar(txt) { try { const o = JSON.parse(txt); if (!o || o.v !== 1 || !o.ans) throw 0; S = Object.assign(novoEstado(), o); salvar(); aviso("Progresso importado."); ir("inicio"); } catch (e) { aviso("Esse texto não é um backup válido deste app."); } }

/* ---------- avisos e diálogos dentro da página ---------- */
function aviso(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 3200); }
function dialogo(tit, txt, ok, fn) {
  const d = $("#dlg"); d.innerHTML = `<div class="dbox"><h3>${esc(tit)}</h3><p>${esc(txt)}</p><div class="btns"><button class="btn" id="dno">Cancelar</button><button class="btn primary" id="dok">${esc(ok)}</button></div></div>`;
  d.classList.add("show"); $("#dno").onclick = () => d.classList.remove("show"); $("#dok").onclick = () => { d.classList.remove("show"); fn(); };
}
