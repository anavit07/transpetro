<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rota Instrumentação · Transpetro 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F3;--card:#FFFFFF;--ink:#23262B;--muted:#5F6670;--line:#E3E4E1;--acc:#C2560C;--acc2:#F07A1F;--accbg:#FDF0E6;--ok:#1F7A4D;--okbg:#E6F4EC;--bad:#B3261E;--badbg:#FBEAE8;--warn:#8A5A00;--warnbg:#FFF4D6;--esp:#C2560C;--por:#2F5FA8;--mat:#2E7D5B;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header.top{position:sticky;top:0;z-index:5;background:rgba(245,245,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}.brand span{font-size:12px;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
h2{font-size:19px;margin:0 0 6px}h3{font-size:16px;margin:4px 0 8px}h4{font-size:14px;margin:12px 0 2px;color:var(--acc)}
.sec{margin:18px 4px 8px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-size:38px;font-weight:700;color:var(--acc);line-height:1.15;margin:2px 0}
.hero{border-top:4px solid var(--acc2)}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{gap:8px;margin:10px 0}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid2>.card{margin:0}
.grid2+.card,.card+.grid2,.grid2+.grid2{margin-top:12px}
.stat .num{font-size:28px;font-weight:700}
.bar{height:8px;background:#ECEDEA;border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar span{display:block;height:100%;background:var(--acc2);border-radius:8px;transition:width .3s}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 16px;font:600 15px Inter,system-ui,sans-serif;min-height:46px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}.btn.full{width:100%;margin-top:12px}.btn.danger{color:var(--bad);border-color:#EBC3BF}.btn.warnb{background:var(--warnbg);border-color:#EAD39A}
.chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:#F0F1EE;color:var(--ink);border:1px solid var(--line);margin:2px 2px 2px 0;font-family:inherit}
button.chip{cursor:pointer;min-height:34px}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:#BFE0CC}.chip.bad{background:var(--badbg);color:var(--bad);border-color:#F0C6C2}.chip.warn{background:var(--warnbg);color:var(--warn);border-color:#EAD39A}
.chip.esp{background:var(--accbg);color:var(--acc);border-color:#F3CFB3}.chip.por{background:#E8EFF9;color:var(--por);border-color:#C6D5EE}.chip.mat{background:#E5F2EC;color:var(--mat);border-color:#BFDCCD}
.chip.sim{background:#F3E8FB;color:#6B3A8C;border-color:#DCC6EC}.chip.simulado{background:var(--accbg);color:var(--acc)}.chip.prova{background:var(--ink);color:#fff}.chip.descanso{background:var(--okbg);color:var(--ok)}
.plan{font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 0}
select,textarea,input[type=file]{width:100%;margin-top:4px;font:15px Inter,system-ui,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
textarea{min-height:110px}
label.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:10px 0}label.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--acc)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}.seg button{flex:1;min-width:90px;min-height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font:600 14px Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer}.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.qrow,.trow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.qrow:first-of-type,.trow:first-child{border-top:0}
.tag{font-size:12px;font-weight:700;background:#F0F1EE;border-radius:6px;padding:2px 7px;white-space:nowrap}.tag.sim{background:#F3E8FB;color:#6B3A8C}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.clock{font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);font-size:18px;min-width:56px;text-align:right}
.enun{font-size:16px;line-height:1.6;margin:14px 0;white-space:normal}
mark{background:#FFE2C7;color:inherit;border-radius:4px;padding:0 2px}
.alts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.alt{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer;min-height:48px;width:100%;margin:4px 0}
.alt.sel{border-color:var(--acc);background:var(--accbg)}.alt.right{border-color:var(--ok);background:var(--okbg)}.alt.wrong{border-color:var(--bad);background:var(--badbg)}.alt:disabled{cursor:default;opacity:1}
.lei{background:#FAFAF8;border:1px dashed #D7D8D4;border-radius:12px;padding:12px;margin-top:8px}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0}.fb.ok{background:var(--okbg);color:#14532D}.fb.bad{background:var(--badbg);color:#7F1D1D}.dica{margin-top:6px;font-size:14px}
.okt{color:var(--ok);font-weight:600}.badt{color:var(--bad);font-weight:600}
.exp p{font-size:15px}
details>summary{cursor:pointer;font-weight:600;padding:4px 0;list-style-position:outside}
details.rev{border-top:1px solid var(--line);padding:8px 0}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:12px 0}.navgrid button{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.navgrid .done{background:#ECEDEA}.navgrid .mk{border-color:#D9A400;box-shadow:inset 0 -3px 0 #D9A400}.navgrid .cur{background:var(--ink);color:#fff}
.opt{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding:12px 0}.opt .btn{align-self:flex-start;margin-top:6px}
.day.today{border:2px solid var(--acc2)}.day.past{opacity:.8}.day.simulado{background:#FFFBF7}.day.prova{background:var(--ink);color:#fff}.day.prova .muted{color:#ddd}
.revs{margin:6px 0}
.rv{padding:8px 0;border-top:1px solid var(--line)}.rv:first-of-type{border-top:0}
.menu{display:flex;flex-direction:column;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}.menu:first-of-type{border-top:0}
.fcard summary{display:flex;flex-direction:column;gap:6px}.fcard code{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--accbg);color:#7A3608;padding:6px 8px;border-radius:8px;white-space:normal}
dl{margin:10px 0 0}dt{font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}dd{margin:2px 0 0;font-size:15px}
.spark{display:flex;gap:8px;align-items:flex-end;height:110px;padding-top:6px}.sb{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}.sb span{width:100%;background:#F3CFB3;border-radius:6px 6px 0 0;min-height:2px}.sb span.full{background:var(--acc)}.sb small{font-size:12px;color:var(--muted);margin-top:4px}
.hide{display:none}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;min-height:58px}
nav.tabs a svg{width:22px;height:22px}nav.tabs a.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#dlg{position:fixed;inset:0;background:rgba(20,22,25,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}#dlg.show{display:flex}
.dbox{background:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%}
@media (max-width:380px){.big{font-size:32px}.grid2{gap:8px}}
@media (min-width:700px){main{padding-top:20px}}
</style>
</head>
<body>
